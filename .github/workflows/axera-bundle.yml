name: AXERA Bundle

# Bundle policy:
# - include AXERA custom server/ML image archives, runtime dependency image archives, and minimal deploy files
# - do not include model cache or pre-downloaded model assets

on:
  workflow_dispatch:
  push:
    tags:
      - 'axera-v*'

permissions:
  contents: read

env:
  AXENGINE_WHEEL_URL: https://github.com/AXERA-TECH/pyaxengine/releases/download/0.1.3.rc3/axengine-0.1.3-py3-none-any.whl

jobs:
  build-models:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set bundle version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "BUNDLE_VERSION=${GITHUB_REF_NAME#axera-}" >> "$GITHUB_ENV"
          else
            echo "BUNDLE_VERSION=dev" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build AXERA model package
        run: |
          python -m pip install --upgrade pip huggingface_hub
          mkdir -p out/models
          python scripts/axera/package-models.py \
            --output out/models \
            --version "${BUNDLE_VERSION}"

      - name: Upload AXERA model package
        uses: actions/upload-artifact@v4
        with:
          name: immich-axera-models
          path: out/models/*.tar.gz
          if-no-files-found: error

  build-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: aarch64
            docker_platform: linux/arm64
            runner: ubuntu-24.04-arm
            deploy_dir: deployment/axera/aarch64
            server_archive: ax-immich-server-aarch64.tar
            ml_archive: ax-immich-ml-aarch64.tar
            valkey_archive: valkey-8-bookworm-aarch64.tar
            postgres_archive: immich-postgres-aarch64.tar
          - platform_name: x86
            docker_platform: linux/amd64
            runner: ubuntu-24.04
            deploy_dir: deployment/axera/x86
            server_archive: ax-immich-server-x86.tar
            ml_archive: ax-immich-ml-x86.tar
            valkey_archive: valkey-8-bookworm-x86.tar
            postgres_archive: immich-postgres-x86.tar
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set bundle version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "BUNDLE_VERSION=${GITHUB_REF_NAME#axera-}" >> "$GITHUB_ENV"
          else
            echo "BUNDLE_VERSION=dev" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build ML wheel
        run: |
          python -m pip install --upgrade pip build hatchling
          python -m build --wheel --no-isolation machine-learning

      - name: Prepare output directories
        run: |
          rm -rf out
          mkdir -p out/images out/packages out/bundles
          cp machine-learning/requirements.txt out/packages/
          cp machine-learning/dist/*.whl out/packages/
          curl -fL "${AXENGINE_WHEEL_URL}" -o out/packages/axengine-0.1.3-py3-none-any.whl

      - name: Build server image archive
        run: |
          docker buildx build \
            --platform "${{ matrix.docker_platform }}" \
            --file server/Dockerfile \
            --build-arg "GITHUB_TOKEN=${{ github.token }}" \
            --tag "ax-immich-server:latest" \
            --output "type=docker,dest=out/images/${{ matrix.server_archive }}" \
            .
          gzip -f "out/images/${{ matrix.server_archive }}"

      - name: Build AXERA ML image archive
        run: |
          docker buildx build \
            --platform "${{ matrix.docker_platform }}" \
            --file machine-learning/Dockerfile \
            --build-arg "DEVICE=cpu" \
            --build-arg "AXENGINE_WHEEL_URL=${AXENGINE_WHEEL_URL}" \
            --tag "ax-immich-ml:latest" \
            --output "type=docker,dest=out/images/${{ matrix.ml_archive }}" \
            machine-learning
          gzip -f "out/images/${{ matrix.ml_archive }}"

      - name: Save runtime dependency image archives
        run: |
          set -euxo pipefail

          docker pull --platform "${{ matrix.docker_platform }}" \
            docker.io/valkey/valkey:8-bookworm@sha256:5b8f8c333bef895c925f56629d6ba90aea95a4f7391f62411e625267c600b19c
          docker tag \
            docker.io/valkey/valkey:8-bookworm@sha256:5b8f8c333bef895c925f56629d6ba90aea95a4f7391f62411e625267c600b19c \
            valkey/valkey:8-bookworm
          docker save \
            --output "out/images/${{ matrix.valkey_archive }}" \
            valkey/valkey:8-bookworm
          gzip -f "out/images/${{ matrix.valkey_archive }}"

          docker pull --platform "${{ matrix.docker_platform }}" \
            ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:32324a2f41df5de9efe1af166b7008c3f55646f8d0e00d9550c16c9822366b4a
          docker tag \
            ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:32324a2f41df5de9efe1af166b7008c3f55646f8d0e00d9550c16c9822366b4a \
            ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          docker save \
            --output "out/images/${{ matrix.postgres_archive }}" \
            ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          gzip -f "out/images/${{ matrix.postgres_archive }}"

      - name: Create platform bundle
        run: |
          bash scripts/axera/package-bundle.sh \
            "${{ matrix.platform_name }}" \
            "${BUNDLE_VERSION}" \
            "${{ matrix.deploy_dir }}" \
            docker/example.env \
            out/images \
            out/packages \
            out/bundles

      - name: Upload platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: immich-axera-${{ matrix.platform_name }}
          path: out/bundles/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish tag release
    needs:
      - build-models
      - build-bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: ${{ github.ref_type == 'tag' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          set -euxo pipefail
          mkdir -p dist
          find artifacts -type f -name '*.tar.gz' -exec cp -a {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          ls -lh dist

      - name: Generate release notes
        run: |
          cat > release_body.md <<'EOF'
          AXERA Immich 发布包。

          Assets：

          - `immich-axera-aarch64-*.tar.gz`：AX650/aarch64 部署包。
          - `immich-axera-x86-*.tar.gz`：x86 部署包。
          - `immich-axera-models-*.tar.gz`：可选离线模型包。
          EOF

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: false
          overwrite_files: true
          body_path: release_body.md
          files: dist/*.tar.gz
